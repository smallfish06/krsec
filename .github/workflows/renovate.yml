name: Renovate

on:
  schedule:
    # Daily at 05:45 KST (20:45 UTC) — finishes before the 08:30 KST automation.
    - cron: '45 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (none = open PRs, lookup = scan only, full = scan + diffs)'
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'lookup'
          - 'full'
      log_level:
        description: 'Renovate log level'
        type: choice
        default: 'info'
        options:
          - 'info'
          - 'debug'

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  security-events: read
  statuses: read

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure dry-run mode
        if: ${{ inputs.dry_run == 'lookup' || inputs.dry_run == 'full' }}
        run: echo "RENOVATE_DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"

      - name: Run self-hosted Renovate
        uses: renovatebot/github-action@v48.0.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <bot@renovateapp.com>'
          RENOVATE_REQUIRE_CONFIG: required
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN || github.token }}
